<!--
  Generic Dynamic Form Template for Folder-Based Services
  Fields are hydrated dynamically from the service's config.json by customer.js.
-->
<div class="service-form-wrapper" data-dynamic-schema-form="true">
  <div class="form-section-header">
    <h3>Service Application Form</h3>
    <p class="text-muted">Fields marked with <span class="req-star">*</span> are mandatory.</p>
  </div>
  <div class="dynamic-text-fields form-grid-2"></div>
  <div class="dynamic-file-fields upload-cards-grid"></div>
</div>
